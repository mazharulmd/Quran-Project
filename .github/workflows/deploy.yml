name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/quranic-learning-app-g3w7wf
  workflow_dispatch:

# contents: write is for pushing the built site to the gh-pages branch.
permissions:
  contents: write
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Publishes the same build two ways, so the site is live under either
  # setting of Settings → Pages → Source:
  #
  #   "GitHub Actions"                     → the deploy job below
  #   "Deploy from a branch" → gh-pages /  → the branch pushed here
  #
  # Only one is ever active; the other is a harmless no-op. This exists
  # because GITHUB_TOKEN cannot set the source itself, and serving the
  # repository source instead of the build yields a blank page.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The build uses relative asset paths, so it needs no base-path input:
      # it works at /<repo>/, at a domain root, or anywhere else.
      - run: npm run build

      - name: Publish build to gh-pages branch
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $SHA"
          # Force-push: this branch holds build output only, never history.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
          echo "Pushed $(git rev-parse --short HEAD) to gh-pages"

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only meaningful when Source is "GitHub Actions"; it fails harmlessly
    # otherwise, and the gh-pages branch above still serves the site.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
