name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/quranic-learning-app-g3w7wf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The build uses relative asset paths, so it needs no base-path input:
      # it works at /<repo>/, at a domain root, or anywhere else.
      - run: npm run build

      # Requires Settings → Pages → Source: "GitHub Actions".
      # Enabling it from here needs permissions GITHUB_TOKEN does not have.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
