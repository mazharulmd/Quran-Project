পর বান্দা “আলহামদু লিল্লাহি রব্বিল-‘আলামীন” বললে আল্লাহ বলেন “আমার বান্দা আমার প্রশংসা করেছে।” (সহীহ মুসলিম)`,`সহীহ বুখারীতে এসেছে, সাহাবাদের একটি দল এক ব্যক্তিকে বিষ দংশিত রোগীর উপর সূরা ফাতিহা পড়ে ঝাড়ফুঁক করেছিল, তাতে সে সুস্থ হয়ে যায়। রাসূলুল্লাহ ﷺ বললেন: “তোমরা কী করে জানলে এটি রুকইয়াহ (আরোগ্যের দুআ)?!” — অর্থাৎ ফাতিহা শিফা হিসেবেও পড়া হয়।`,`যে ব্যক্তি নিজের আমলে সূরা ফাতিহা পড়ে না, তার নামাজ বাহ্যত অসম্পূর্ণ — রাসূলুল্লাহ ﷺ বলেছেন: “যে ব্যক্তি সূরা ফাতিহা পড়েনি, তার নামাজ হয়নি।” (সহীহ বুখারী ও মুসলিম)`]},ayahs:[{number:1,theme:`বিসমিল্লাহ — সূচনা`,spans:[{t:`بِسْمِ `},{t:`اللَّهِ `},{t:`ال`,r:`lam-shamsi`},{t:`رَّحْمَ`},{t:`ٰ`,r:`madd`},{t:`نِ `},{t:`ال`,r:`lam-shamsi`},{t:`رَّحِ`},{t:`ي`,r:`madd`},{t:`مِ`}],uccharon:`বিসমিল্লা-হির রাহ্মা-নির রাহী-ম`,translit:`Bismillāhir-raḥmānir-raḥīm`,bn:`শুরু করছি আল্লাহর নামে — যিনি পরম করুণাময়, অতি দয়ালু।`,en:`In the name of Allah, the Most Gracious, the Most Merciful.`,audio:{start:0,end:3.18},words:[{id:`1:1:1`,arabic:`بِسْمِ`,translit:`bismi`,uccharon:`বিস্মি`,bn:`নামের মাধ্যমে / নামে`,en:`in (the) name`,root:`س م و`,rootNote:`স-ম-ও মূলের অর্থ উচ্চ হওয়া, চিহ্নিত হওয়া। “ইসম” (নাম) সেই চিহ্ন যা কোনো জিনিসকে শনাক্ত করে এবং তাকে সম্মানে উঁচু করে।`,grammar:`জার-মাজরূর বাক্যাংশ — بِ + اِسْم।`},{id:`1:1:2`,arabic:`اللَّهِ`,translit:`allāhi`,uccharon:`আল্লা-হি`,bn:`আল্লাহর`,en:`of Allah`,root:`أ ل ه`,rootNote:`إِلَه (উপাস্য) মূল থেকে — আলিফ-লাম যুক্ত হয়ে শুধু সত্য উপাস্যের নাম “আল্লাহ”।`,grammar:`জার-মাজরূর, মুদাফ ইলাইহি; ইসমে জালালা।`},{id:`1:1:3`,arabic:`الرَّحْمَٰنِ`,translit:`ar-raḥmāni`,uccharon:`রাহ্মা-নি`,bn:`পরম করুণাময়`,en:`the Most Gracious`,root:`ر ح م`,rootNote:`র-হ-ম মূলের অর্থ দয়া ও করুণা। “রাহমান” ব্যাপক করুণা — যা মুমিন-অমুসলিম সবার উপর আল্লাহ বর্ষণ করেন।`,grammar:`সিফাত/আলামত, মাজরূর; শুধু আল্লাহর জন্য প্রযোজ্য নাম।`},{id:`1:1:4`,arabic:`الرَّحِيمِ`,translit:`ar-raḥīmi`,uccharon:`রাহী-মি`,bn:`অতি দয়ালু`,en:`the Most Merciful`,root:`ر ح م`,rootNote:`একই র-হ-ম মূল। “রাহীম” বিশেষ দয়া — যা কিয়ামতের দিন বিশেষত মুমিনদের প্রতি প্রকাশ পাবে।`,grammar:`সিফাত, মাজরূর; “রাহমান” ব্যাপক, “রাহীম” বিশেষ — দুই নাম একত্রে এসেছে।`}],tajweedNotes:[{rule:`madd`,text:`الرَّحْمَٰنِ-এর খঞ্জর আলিফ ও الرَّحِيمِ-এর ইয়া — দুটোই ২ হরকতের স্বাভাবিক টান।`},{rule:`lam-shamsi`,text:`الرَّحْمَٰنِ ও الرَّحِيمِ — র শামসী হরফ, তাই লাম পড়া হয় না: “আর-রাহ্মান”, “আল-রাহমান” নয়।`}],memoryHook:`চারটি শব্দ, একটাই ছাঁচ: আল্লাহর নাম + দুটি করুণার গুণ। “রাহমান” আর “রাহীম” একই মূলের দুই সিঁড়ি — একজন শিখলে অন্যজন হাতছাড়া হয় না।`,tafsir:[{title:`কেন বিসমিল্লাহ দিয়ে শুরু`,body:[`রাসূলুল্লাহ ﷺ-এর সুন্নাহ ছিল গুরুত্বপূর্ণ কাজ বিসমিল্লাহ দিয়ে শুরু করা। কুরআনের ১১৩টি সূরার ১১২টির শুরুতে বিসমিল্লাহ আছে — শুধু সূরা তাওবায় নেই। আর সূরা ফাতিহার ক্ষেত্রে এটি কেবল সূচনা নয়, নিজেই আয়াত ১।`,`অর্থ গভীর: “আল্লাহর নামে” মানে — আমি আমার কাজ নিজের শক্তিতে নয়, আল্লাহর নাম ও তাঁর তাওফীকে করছি। যে বিসমিল্লাহ পড়ে সে স্বীকার করে নেয়, তার সব কর্মের উৎস আল্লাহ।`,`দুটি গুণ — রাহমান ও রাহীম — প্রথম আয়াতেই দুবার করে বলা হয়েছে। কারণ এই সূরাটি পড়া হচ্ছে একজন দুর্বল বান্দার পক্ষ থেকে, যে শুরু থেকেই আশ্রয় চাইছে তার প্রতিপালকের করুণার।`]},{title:`রাহমান বনাম রাহীম`,body:[`“আর-রাহমান” হলো সেই ব্যাপক করুণা যা আল্লাহ দুনিয়ায় সবাইকে দিয়েছেন — খাদ্য, বাতাস, সুস্থতা, জীবন। এতে ঈমানদার-অনীতমানদার কোনো ভেদ নেই।`,`“আর-রাহীম” হলো বিশেষ করুণা — শেষ বিচারের দিন মুমিনদের প্রতি যে দয়া প্রকাশ পাবে। তাই কুরআনে অনেক জায়গায় এই দুই নাম একত্রে এসেছে: ব্যাপক করুণা দিয়ে সৃষ্টি চলে, আর বিশেষ করুণা দিয়ে মুমিন উদ্ধার পায়।`,`দুটি নামই র-হ-ম মূল থেকে — যেন বলা হচ্ছে, এই সূরার পুরো চাওয়াই দয়ার ঘেরাটোপে রাখা।`]}]},{number:2,theme:`প্রশংসা আল্লাহরই প্রাপ্য`,spans:[{t:`الْ`,r:`lam-qamari`},{t:`حَمْدُ `},{t:`لِلَّهِ `},{t:`رَبِّ `},{t:`الْ`,r:`lam-qamari`},{t:`عَ`},{t:`ا`,r:`madd`},{t:`لَمِ`},{t:`ي`,r:`madd`},{t:`نَ`}],uccharon:`আলহামদু লিল্লা-হি রব্বিল-‘আলামীন`,translit:`Al-ḥamdu lillāhi rabbil-ʿālamīn`,bn:`সমস্ত প্রশংসা আল্লাহর — যিনি বিশ্বজগতের প্রতিপালক,`,en:`All praise is due to Allah, Lord of the worlds —`,audio:{start:3.18,end:9.34},words:[{id:`1:2:1`,arabic:`الْحَمْدُ`,translit:`al-ḥamdu`,uccharon:`আলহামদু`,bn:`সমস্ত প্রশংসা`,en:`all praise`,root:`ح م د`,rootNote:`ح-م-د মূলের অর্থ প্রশংসা করা। “মাহমুদ”, “আহমাদ” — সবই এই মূল থেকে, অর্থাৎ প্রশংসিত।`,grammar:`মুবতাদা (বাক্যের বিষয়), মারফু; আলিফ-লাম দিয়ে সমস্ত প্রকার প্রশংসা বুঝানো হয়েছে।`},{id:`1:2:2`,arabic:`لِلَّهِ`,translit:`lillāhi`,uccharon:`লিল্লা-হি`,bn:`আল্লাহর জন্যই`,en:`for Allah`,root:`أ ل ه`,grammar:`লামুল ইসতিহকাক (স্বত্ববাচক লাম) + ইসমে জালালা — প্রশংসা একমাত্র আল্লাহরই।`},{id:`1:2:3`,arabic:`رَبِّ`,translit:`rabbi`,uccharon:`রব্বি`,bn:`প্রতিপালক`,en:`Lord`,root:`ر ب ب`,rootNote:`র-ব-ব মূলের অর্থ মালিক হওয়া, লালন-পালন করা, ধাপে ধাপে পরিপূর্ণতায় পৌঁছে দেওয়া।`,grammar:`বদল/আতা‘বয়ান, মাজরূর; রব্বের পরে ইযফাত — “সকল সৃষ্টির প্রতিপালক”।`},{id:`1:2:4`,arabic:`الْعَالَمِينَ`,translit:`al-ʿālamīna`,uccharon:`‘আলামীন`,bn:`বিশ্বজগতের`,en:`of the worlds`,root:`ع ل م`,rootNote:`আলাম (বিশ্ব) এসেছে ع-ل-م থেকে — কারণ সৃষ্টিজগৎ এমন এক নিদর্শন যা দিয়ে আল্লাহকে চেনা যায়।`,grammar:`মুদাফ ইলাইহি, মাজরূর; বহুবচন — এক বিশ্ব নয়, অসংখ্য সৃষ্টিজগৎ।`}],tajweedNotes:[{rule:`lam-qamari`,text:`الْحَمْدُ ও الْعَالَمِينَ — ح ও ع কমরী হরফ, তাই লাম স্পষ্ট: “আল-হামদু”, “আল-‘আলামীন”।`},{rule:`madd`,text:`الْعَالَمِينَ-এ দুটি মাদ্দ: عَال-এর আলিফ এবং مِين-এর ইয়া — প্রতিটি ২ হরকত।`}],memoryHook:`সূরার সবচেয়ে বিখ্যাত বাক্য — “আলহামদু লিল্লাহ”। তিনটি শব্দ, তিনটি রহস্য: প্রশংসা (হামদ) → আল্লাহর জন্য (লিল্লাহ) → প্রতিপালক (রব্বিল আলামীন)। যতবার এই তিন শব্দ মনে পড়ে, ততবার পুরো আয়াত চলে আসে।`,tafsir:[{title:`হামদ মানে কী`,body:[`“হামদ” হলো স্বেচ্ছায়, ভালোবেসে কাউকে প্রশংসা করা — তার গুণ স্বীকার করে নেওয়া। এর সাথে জড়িয়ে আছে কৃতজ্ঞতা (শোকর) ও ভালোবাসা। আয়াতে আলিফ-লাম দিয়ে বলা হয়েছে “আল-হামদ” — মানে সমস্ত প্রশংসা, সব প্রকার, সবার কাছ থেকে, সব সময়।`,`প্রশংসা শুধু মুখে নয় — জীবনাচরণেও। হামদ যখন অন্তর থেকে ওঠে, তখন তা আল্লাহর প্রতি পূর্ণ সন্তুষ্টির বহিঃপ্রকাশ। মুমিন জানেন: যা কিছু ভালো, তার উৎস আল্লাহ; তাই প্রশংসাও তাঁরই।`]},{title:`রব্বিল ‘আলামীন — কোন জগৎ?`,body:[`“আলাম” অর্থ জগৎ/সৃষ্টিকূল। বহুবচনে “আলামীন” — অর্থাত্ অসংখ্য সৃষ্টিজগৎ: মানুষ, ফেরেশতা, জিন, পশু, উদ্ভিদ, গ্রহ-নক্ষত্র — সবকিছু মিলিয়ে এক একটি জগৎ।`,`প্রতিপালক মানে শুধু স্রষ্টা নন — যিনি প্রতিটি সৃষ্টিকে লালন করেন, তার রিযিক দেন, তাকে গড়ে তোলেন, পরিচালনা করেন। “রব” নামটিই বলে দেয়: পৃথিবীর কোনো কিছুই মালিকবিহীন, সবার একজন মালিক আছেন — আল্লাহ।`,`এই আয়াতেই রয়েছে তাওহীদের প্রথম ঘোষণা: প্রশংসা ও প্রতিপালন — দুটিই এক আল্লাহর।`]}]},{number:3,theme:`করুণার দুই নাম`,spans:[{t:`ال`,r:`lam-shamsi`},{t:`رَّحْمَ`},{t:`ٰ`,r:`madd`},{t:`نِ `},{t:`ال`,r:`lam-shamsi`},{t:`رَّحِ`},{t:`ي`,r:`madd`},{t:`مِ`}],uccharon:`আর-রাহ্মা-নির রাহী-ম`,translit:`Ar-raḥmānir-raḥīm`,bn:`পরম করুণাময়, অতি দয়ালু,`,en:`The Most Gracious, the Most Merciful,`,audio:{start:9.34,end:15.89},words:[{id:`1:3:1`,arabic:`الرَّحْمَٰنِ`,translit:`ar-raḥmāni`,uccharon:`রাহ্মা-নি`,bn:`পরম করুণাময়`,en:`the Most Gracious`,root:`ر ح م`,rootNote:`র-হ-ম — ব্যাপক করুণা, যা সবার উপর আল্লাহর রহমত বর্ষিত হয়।`,grammar:`সিফাত, মাজরূর — আয়াত ২-এর রব্বের বিশ্লেষণ।`},{id:`1:3:2`,arabic:`الرَّحِيمِ`,translit:`ar-raḥīmi`,uccharon:`রাহী-মি`,bn:`অতি দয়ালু`,en:`the Most Merciful`,root:`ر ح م`,rootNote:`একই মূল — বিশেষ দয়া, যা মুমিনদের প্রতি আখিরাতে পূর্ণ প্রকাশ পাবে।`,grammar:`সিফাত, মাজরূর।`}],tajweedNotes:[{rule:`madd`,text:`রাহ্মা-নি-র খঞ্জর আলিফ ও রাহী-মি-র ইয়া — ২ হরকত করে।`},{rule:`lam-shamsi`,text:`দুটি শব্দই র দিয়ে শুরু — র শামসী, তাই লাম পড়া হয় না: “আর-রাহমানির রাহীম”।`}],memoryHook:`এই আয়াতটি আয়াত ১-এরই শেষাংশের পুনরাবৃত্তি। “রাহ্মানির রাহীম” একবার শিখলে দুই জায়গায় কাজে লাগে — সূরা ফাতিহার ভেতরেই প্রথম আয়াত আর তৃতীয় আয়াত দুটোই বসে যায়।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`আয়াত ২-এ বলা হলো আল্লাহ “রব্বিল আলামীন” — বিশ্বজগতের প্রতিপালক। এখন সেই রব কেমন? আয়াত ৩ বলে: তিনি রাহমান ও রাহীম। অর্থাত্ শুধু ক্ষমতাবান স্রষ্টা নন — তিনি অপরিসীম দয়ালু।`,`প্রশংসার এই ধারাবাহিকতায় একটি শিক্ষা লুকানো আছে: আল্লাহর গুণাবলি কেবল মুখে বলার জন্য নয়, তা চিন্তা করার জন্য। যে জানে তার রব করুণাময়, সে তাঁর কাছে ভরসা রাখে, তাঁর কাছ থেকে আশা ছাড়ে না।`,`ইমাম ইবনে কাসীর উল্লেখ করেছেন, এই দুই নামের মাঝে একটি সূক্ষ্ম সমন্বয় — রাহমান দুনিয়ার দয়া (সবাই পায়), রাহীম আখিরাতের দয়া (মুমিন পায়)। তাই দুটি একসাথে আল্লাহর পূর্ণ করুণার চিত্র আঁকে।`]}]},{number:4,theme:`বিচার দিনের মালিক`,spans:[{t:`مَ`},{t:`ا`,r:`madd`},{t:`لِكِ `},{t:`يَ`},{t:`وْ`},{t:`مِ `},{t:`ال`,r:`lam-shamsi`},{t:`دِّ`},{t:`ي`,r:`madd`},{t:`نِ`}],uccharon:`মা-লিকি ইয়াওমিদ-দ্বীন`,translit:`Māliki yawmid-dīn`,bn:`বিচার দিনের মালিক।`,en:`Master of the Day of Judgment.`,audio:{start:15.89,end:22.23},words:[{id:`1:4:1`,arabic:`مَالِكِ`,translit:`māliki`,uccharon:`মা-লিকি`,bn:`মালিক`,en:`Master`,root:`م ل ك`,rootNote:`ম-ল-ক মূলের অর্থ অধিকার করা, শাসন করা। “মুলক” (রাজত্ব) ও “মালিক” — একই মূল থেকে।`,grammar:`সিফাত/বদল, মাজরূর; কিছু কিরাআতে মَلِكِ (রাজা) পড়া হয় — উভয় অর্থই গ্রহণযোগ্য।`},{id:`1:4:2`,arabic:`يَوْمِ`,translit:`yawmi`,uccharon:`ইয়াওমি`,bn:`দিনের`,en:`of the Day`,root:`ي و م`,rootNote:`ইয়াওম মানে দিন/সময়কাল। এখানে সেই মহান দিন — যেদিন সবাইকে হিসাবের জন্য দাঁড় করানো হবে।`,grammar:`মুদাফ, মাজরূর।`},{id:`1:4:3`,arabic:`الدِّينِ`,translit:`ad-dīni`,uccharon:`দ্বীন`,bn:`বিচার, প্রতিদান`,en:`of Judgment`,root:`د ي ن`,rootNote:`দ-ই-ন মূলের অর্থ হিসাব ও প্রতিদান। দ্বীন মানে আনুগত্য; আর “ইয়াওমিদ দ্বীন” হলো প্রতিদান ও হিসাবের দিন।`,grammar:`মুদাফ ইলাইহি, মাজরূর; د শামসী হরফ বলে লাম মিশে গেছে।`}],tajweedNotes:[{rule:`madd`,text:`مَالِكِ-এর আলিফ ও الدِّينِ-এর ইয়া — মাদ্দ ২ হরকত। আর يَوْمِ-এর ওয়াও হলো নরম (লীন) ওয়াও, টান নয়: “ইয়াওম”।`},{rule:`lam-shamsi`,text:`الدِّينِ — د শামসী হরফ, তাই লাম পড়া হয় না: “আদ-দ্বীন”, “আল-দ্বীন” নয়।`}],memoryHook:`আয়াত ২–৪ একসাথে তিনটি গুণ শেখায়: রব্বিল আলামীন (প্রতিপালক), রাহমানির রাহীম (করুণাময়), মালিকি ইয়াওমিদ দ্বীন (বিচারক)। তিনটি প্রশ্নের উত্তর: কে লালন করেন? কেমন করেন? শেষে কী করবেন?`,tafsir:[{title:`বিচার দিনের কথা কেন`,body:[`প্রশংসার ধারায় এখন আসে আল্লাহর কর্তৃত্বের চূড়ান্ত ঘোষণা: তিনি সেই দিনের মালিক যেদিন সব রাজা-বাদশাহ, সব শক্তি — সবকিছু শেষ হয় ic:`سُورَةُ الضُّحَىٰ`,bnName:`সূরা আদ-দুহা`,enName:`Ad-Duha`,bnMeaning:`পূর্বাহ্ন / সকালের আলো`,revelation:`মাক্কী`,ayahCount:11,reciter:{name:`Yasser Al-Dosari`,bnName:`শাইখ ইয়াসির আদ-দোসারী`},audioUrl:`audio/093-ad-duha-yasser-al-dosari.mp3`,intro:[`সূরা আদ-দুহা কুরআনের ৯৩তম সূরা, আয়াত সংখ্যা ১১। এটি সান্ত্বনার সূরা — নাযিল হয়েছিল এমন এক সময়ে যখন রাসূলুল্লাহ ﷺ-এর উপর কিছুদিন ওহী আসা বন্ধ ছিল এবং বিরোধীরা তাঁকে খোঁটা দিচ্ছিল।`,`সূরাটির গঠন অসাধারণ পরিপাটি: প্রথমে দুটি শপথ (আয়াত ১–২), তারপর তিনটি সান্ত্বনা (৩–৫), তারপর অতীতের তিনটি অনুগ্রহের স্মরণ (৬–৮), আর সবশেষে সেই তিন অনুগ্রহের সাথে মিলিয়ে তিনটি করণীয় (৯–১১)।`,`এই আয়না-গঠনই সূরাটিকে মুখস্থ করার সবচেয়ে বড় চাবি: “তুমি এতীম ছিলে” মিলে যায় “এতীমের প্রতি কঠোর হয়ো না”-র সাথে; “তুমি নিঃস্ব ছিলে” মিলে যায় “নিয়ামতের কথা বলো”-র সাথে।`],shanENuzul:{title:`শানে নুযূল ও প্রেক্ষাপট`,body:[`সহীহ বুখারী ও মুসলিমে জুনদুব ইবনে আবদুল্লাহ রাদিয়াল্লাহু আনহু থেকে বর্ণিত, কিছুদিন রাসূলুল্লাহ ﷺ-এর কাছে জিবরীল আলাইহিস সালাম আসেননি। তখন এক নারী বলল: “আমার তো মনে হয়, তোমার শয়তান তোমাকে ছেড়ে গেছে।” এরপরই আল্লাহ নাযিল করলেন — “ওয়াদ্দুহা, ওয়াল্লাইলি ইযা সাজা, মা ওয়াদ্দা‘আকা রব্বুকা ওয়ামা ক্বলা।”`,`ওহী বন্ধ থাকার এই সময়টিকে বলা হয় “ফাতরাতুল ওহী”। রাসূলুল্লাহ ﷺ ভেতরে ভেতরে অস্থির হয়ে পড়েছিলেন — তিনি ভাবছিলেন, আল্লাহ কি তাঁর প্রতি অসন্তুষ্ট হলেন? এই সূরা সেই আশঙ্কার সরাসরি জবাব।`,`লক্ষণীয়, আল্লাহ জবাব দিয়েছেন শপথ দিয়ে — যেন বলছেন, নীরবতা মানে পরিত্যাগ নয়। দিনের আলো যেমন সত্য, রাতের নিস্তব্ধতাও তেমনই সত্য; দুটোই তাঁর ব্যবস্থাপনা।`]},virtues:{title:`ফযীলত ও বৈশিষ্ট্য`,body:[`এই সূরাটি কুরআনের সেই অল্প কয়েকটি সূরার একটি যেখানে আল্লাহ তাঁর নবীকে সরাসরি ব্যক্তিগতভাবে সান্ত্বনা দিয়েছেন। ইমাম ইবনুল কায়্যিম বলেন, দুঃসময়ে থাকা প্রত্যেক মুমিনের জন্য এতে সান্ত্বনা রয়েছে — কারণ আল্লাহর নীরবতা কখনোই তাঁর পরিত্যাগ নয়।`,`মক্কী কিরাআতের ধারায় সূরা দুহা থেকে সূরা নাস পর্যন্ত প্রতিটি সূরার শেষে তাকবীর (আল্লাহু আকবার) বলার একটি প্রসিদ্ধ প্রথা রয়েছে, যা ইবনে কাসীর রাহিমাহুল্লাহর কিরাআতে বর্ণিত। বলা হয়, ওহী পুনরায় শুরু হওয়ার আনন্দে এর সূচনা। তবে এর সনদ ও হুকুম নিয়ে আলিমগণের মধ্যে মতভেদ আছে — এটি সকল কিরাআতে আবশ্যক নয়।`,`সূরাটির শেষ নির্দেশ — “আপনার প্রতিপালকের অনুগ্রহের কথা বর্ণনা করুন” — কে অনেক আলিম কৃতজ্ঞতা প্রকাশের একটি স্থায়ী নীতি হিসেবে গ্রহণ করেছেন।`]},ayahs:[{number:1,theme:`দিনের আলোর শপথ`,spans:[{t:`وَ`},{t:`ال`,r:`lam-shamsi`},{t:`ضُّحَ`},{t:`ى`,r:`madd`}],uccharon:`ওয়াদ্‌-দুহা-`,translit:`Waḍ-ḍuḥā`,bn:`শপথ পূর্বাহ্নের,`,en:`By the morning brightness,`,audio:{start:0,end:1.34},words:[{id:`93:1:1`,arabic:`وَ`,translit:`wa`,uccharon:`ওয়া`,bn:`শপথ`,en:`By`,grammar:`কসমের হরফ (ওয়াও কসম) — শপথ বোঝাতে ব্যবহৃত হয়।`},{id:`93:1:2`,arabic:`الضُّحَى`,translit:`aḍ-ḍuḥā`,uccharon:`দ্‌-দুহা-`,bn:`পূর্বাহ্ন, সকালের উজ্জ্বল আলো`,en:`the morning brightness`,root:`ض ح و`,rootNote:`ض-ح-و মূলের অর্থ আলো ছড়িয়ে পড়া। সূর্য উঠে কিছুটা উঁচু হওয়ার পর দিনের যে ঝলমলে অংশ — তা-ই “দুহা”। সালাতুদ দুহাও এই সময়ের নামাজ।`,grammar:`মাজরূর ইসম (কসমের কারণে), আলিফ-লাম যুক্ত।`}],tajweedNotes:[{rule:`lam-shamsi`,text:`الضُّحَى — ض শামসী হরফ, তাই লাম পড়া হয় না: “আদ্‌-দুহা”, “আল-দুহা” নয়।`},{rule:`madd`,text:`শেষের ى আলিফ মাকসূরা — ২ হরকত টান: “দুহা-”।`}],memoryHook:`সূরার সবচেয়ে ছোট আয়াত — মাত্র একটি শব্দ। আল্লাহ শুরু করছেন দিনের সবচেয়ে উজ্জ্বল মুহূর্ত দিয়ে, কারণ পুরো সূরার বার্তাই হলো: অন্ধকার সাময়িক, আলো ফিরে আসে।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`আল্লাহ শপথ করছেন “আদ-দুহা” — সকালের সেই সময়ের, যখন সূর্য উঁচু হয়ে আলো চারদিকে ছড়িয়ে পড়ে। এটি দিনের সবচেয়ে প্রাণবন্ত, সবচেয়ে আশাব্যঞ্জক মুহূর্ত।`,`আল্লাহ তাঁর সৃষ্টির যে জিনিসের শপথ করেন, তাতে বান্দার জন্য বিশেষ নিদর্শন থাকে। এখানে আলোর শপথ করা হচ্ছে এমন একজনকে সান্ত্বনা দিতে গিয়ে, যিনি অন্ধকারের মতো একটা সময় পার করছিলেন — ওহী বন্ধ ছিল।`,`মুফাসসিরগণ বলেন, শপথের বিষয়বস্তু এবং জবাবের মধ্যে সবসময় একটি সম্পর্ক থাকে। আলো ফিরে আসার নিশ্চয়তা যেমন প্রকৃতির নিয়ম, ওহী ফিরে আসাও তেমনি নিশ্চিত ছিল।`]}]},{number:2,theme:`রাতের নিস্তব্ধতার শপথ`,spans:[{t:`وَ`},{t:`ال`,r:`lam-shamsi`},{t:`لَّيْلِ `},{t:`إِذَ`},{t:`ا`,r:`madd`},{t:` سَجَ`},{t:`ى`,r:`madd`}],uccharon:`ওয়াল্‌-লাইলি ইযা- সাজা-`,translit:`Wal-layli idhā sajā`,bn:`শপথ রাত্রির যখন তা গভীর হয়,`,en:`And by the night when it grows still,`,audio:{start:1.34,end:3.84},words:[{id:`93:2:1`,arabic:`وَ`,translit:`wa`,uccharon:`ওয়া`,bn:`শপথ`,en:`And by`,grammar:`কসমের হরফ।`},{id:`93:2:2`,arabic:`اللَّيْلِ`,translit:`al-layl`,uccharon:`ল্‌-লাইলি`,bn:`রাতের`,en:`the night`,root:`ل ي ل`,rootNote:`ل-ي-ل মানে রাত — অন্ধকার ও বিশ্রামের সময়।`,grammar:`মাজরূর ইসম; ل শামসী হরফ বলে লাম মিশে গেছে।`},{id:`93:2:3`,arabic:`إِذَا`,translit:`idhā`,uccharon:`ইযা-`,bn:`যখন`,en:`when`,grammar:`সময়সূচক শর্তবাচক শব্দ (যরফ)।`},{id:`93:2:4`,arabic:`سَجَى`,translit:`sajā`,uccharon:`সাজা-`,bn:`তা গভীর ও নিস্তব্ধ হয়`,en:`it grows still`,root:`س ج و`,rootNote:`س-ج-و মূলের অর্থ স্থির হওয়া, থিতিয়ে পড়া। রাত যখন গভীর হয়ে সব শব্দ থেমে যায় — সেই নিস্তব্ধতাই “সাজা”।`,grammar:`ফি‘ল মাদী (অতীত ক্রিয়া)।`}],tajweedNotes:[{rule:`lam-shamsi`,text:`اللَّيْلِ — ل শামসী হরফ, তাই লাম মিশে গিয়ে “আল্‌-লাইলি”।`},{rule:`madd`,text:`إِذَا ও سَجَى — দুই জায়গাতেই ২ হরকতের স্বাভাবিক টান।`}],memoryHook:`আয়াত ১ ও ২ একটি জোড়া: আলো ↔ অন্ধকার। মনে রাখুন “দুহা” (দিন) তারপর “লাইল” (রাত) — কুরআনে এই জোড়াটি বহুবার আসে, তাই ক্রমটি স্বাভাবিকভাবেই মনে থাকে।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“সাজা” অর্থ রাত যখন থিতিয়ে যায়, সব কোলাহল থেমে যায় এবং চারদিক নিস্তব্ধ হয়ে পড়ে। এটি রাতের নিন্দা নয় — বরং রাতের সেই প্রশান্তির প্রশংসা।`,`এখানে গভীর সান্ত্বনা লুকিয়ে আছে। আল্লাহ কেবল আলোর শপথ করেননি, অন্ধকারেরও করেছেন। অর্থাৎ জীবনের যে সময়টা নীরব, শূন্য ও অন্ধকার মনে হয় — সেটিও আল্লাহর পরিকল্পনারই অংশ, বিচ্ছিন্নতা নয়।`,`ইমাম ইবনে কাসীর উল্লেখ করেন, দিন ও রাতের এই পালাবদল নিজেই একটি প্রমাণ — যিনি রাতের পরে সকাল আনেন, তিনি কষ্টের পরেও স্বস্তি আনবেন।`]}]},{number:3,theme:`ত্যাগ করেননি, বিরূপও হননি`,spans:[{t:`مَ`},{t:`ا`,r:`madd`},{t:` وَدَّعَكَ رَبُّكَ وَمَ`},{t:`ا`,r:`madd`},{t:` قَلَ`},{t:`ى`,r:`madd`}],uccharon:`মা- ওয়াদ্দা‘আকা রব্বুকা ওয়ামা- ক্বলা-`,translit:`Mā waddaʿaka rabbuka wa mā qalā`, তোমার রব”, অর্থাৎ সম্বন্ধটি বহাল রেখেই কথা বলছেন। শব্দচয়নেই আশ্বাস দেওয়া হয়ে গেছে।`,`আরও সূক্ষ্ম বিষয়: দ্বিতীয় অংশে কর্মকারক সর্বনাম (“তোমাকে”) উহ্য রাখা হয়েছে — “ওয়ামা ক্বলা”, “ওয়ামা ক্বলাকা” নয়। মুফাসসিরগণ বলেন, ঘৃণার শব্দটিকে নবী ﷺ-এর সাথে সরাসরি যুক্ত করা থেকেও আল্লাহ বিরত থেকেছেন — এ এক অসাধারণ কোমলতা।`]},{title:`আমাদের জন্য শিক্ষা`,body:[`ওহী বন্ধ থাকা মানে আল্লাহর অসন্তুষ্টি ছিল না — ছিল একটি সাময়িক নীরবতা। তেমনি বান্দার জীবনে দুআ কবুল হতে দেরি হওয়া, বা আত্মিক শুষ্কতার সময় আসা — এগুলোও পরিত্যাগের প্রমাণ নয়।`,`ইমাম ইবনুল কায়্যিম বলেন, আল্লাহর দান যেমন অনুগ্রহ, তাঁর সাময়িক বিরত থাকাও তেমনি হিকমত — কারণ তা বান্দার আকুতি ও নির্ভরতা বাড়িয়ে দেয়।`]}]},{number:4,theme:`পরকাল ইহকালের চেয়ে শ্রেয়`,spans:[{t:`وَلَ`},{t:`لْ`,r:`lam-qamari`},{t:`آ`,r:`madd`},{t:`خِرَةُ خَيْ`},{t:`رٌ`,r:`idgham`},{t:` لَّكَ مِنَ `},{t:`الْ`,r:`lam-qamari`},{t:`أُ`},{t:`و`,r:`madd`},{t:`لَ`},{t:`ى`,r:`madd`}],uccharon:`ওয়ালাল্‌ আ-খিরাতু খাইরুল্‌ লাকা মিনাল্‌ ঊলা-`,translit:`Wa lal-ākhiratu khayrun laka minal-ūlā`,bn:`আপনার জন্যে পরকাল ইহকাল অপেক্ষা শ্রেয়।`,en:`And the Hereafter is better for you than the first (life).`,audio:{start:7.4,end:11.55},words:[{id:`93:4:1`,arabic:`وَلَلْآخِرَةُ`,translit:`wa lal-ākhiratu`,uccharon:`ওয়ালাল্‌ আ-খিরাতু`,bn:`আর অবশ্যই পরকাল`,en:`And surely the Hereafter`,root:`أ خ ر`,rootNote:`أ-خ-ر মানে পিছনে থাকা, পরে আসা। “আখিরাত” অর্থ শেষ জীবন — যা দুনিয়ার পরে আসে।`,grammar:`সংযোজক و + জোরসূচক লাম (লামুত তাওকীদ) + আলিফ-লাম যুক্ত ইসম।`},{id:`93:4:2`,arabic:`خَيْرٌ`,translit:`khayrun`,uccharon:`খাইরুন`,bn:`উত্তম, শ্রেয়`,en:`better`,root:`خ ي ر`,rootNote:`خ-ي-ر মানে কল্যাণ, ভালো — “শার” (অনিষ্ট)-এর বিপরীত।`,grammar:`খবর (বিধেয়), তানভীনযুক্ত; তুলনামূলক অর্থে “অধিক উত্তম”।`},{id:`93:4:3`,arabic:`لَكَ`,translit:`laka`,uccharon:`লাকা`,bn:`আপনার জন্য`,en:`for you`,grammar:`হরফে জার لَ + সর্বনাম كَ।`},{id:`93:4:4`,arabic:`مِنَ`,translit:`mina`,uccharon:`মিনা`,bn:`চেয়ে, অপেক্ষা`,en:`than`,grammar:`হরফে জার; তুলনা বোঝাতে ব্যবহৃত।`},{id:`93:4:5`,arabic:`الْأُولَى`,translit:`al-ūlā`,uccharon:`ল্‌ ঊলা-`,bn:`প্রথমটি, অর্থাৎ ইহকাল`,en:`the first (life)`,root:`أ و ل`,rootNote:`أ-و-ل মানে প্রথম, শুরু। দুনিয়াকে এখানে “প্রথম জীবন” বলা হয়েছে — কারণ এটি আগে আসে, শেষ নয়।`,grammar:`মাজরূর ইসম, আলিফ-লাম যুক্ত।`}],tajweedNotes:[{rule:`idgham`,text:`خَيْرٌ لَّكَ — তানভীনের পরে ل, তাই ইদগাম (গুন্নাহ ছাড়া): “খাইরুল্‌ লাকা”।`},{rule:`lam-qamari`,text:`لْآخِرَةُ ও الْأُولَى — উভয়ের পরে হামযা (কমরী হরফ), তাই লাম স্পষ্ট।`},{rule:`madd`,text:`آ (মাদ্দে বদল), الْأُولَى-র و এবং শেষের ى — সবই ২ হরকত।`}],memoryHook:`বিপরীত জোড়া মনে রাখুন: “আখিরা” (শেষ) বনাম “ঊলা” (প্রথম)। আয়াতটি শেষ হচ্ছে “ঊলা” দিয়ে অথচ শুরু হয়েছে “আখিরা” দিয়ে — উল্টো ক্রমটাই স্মৃতির খুঁটি।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`সান্ত্বনার পর এবার দৃষ্টি প্রসারিত করা হচ্ছে। বর্তমান কষ্টটুকু গোটা হিসাবের একটি ছোট অংশ মাত্র — সামনে যা আসছে তা অনেক বড়।`,`“আল-আখিরা” ও “আল-ঊলা” শব্দ দুটি এখানে দুটি জীবনকে বোঝাচ্ছে: পরকাল ও ইহকাল। আয়াতটি দুনিয়াকে “প্রথম” বলছে, “একমাত্র” নয় — এই শব্দচয়নেই দুনিয়ার আসল অবস্থান ঠিক করে দেওয়া হয়েছে।`,`অনেক মুফাসসির বলেন, এখানে নবী ﷺ-এর জীবনের ক্রমও বোঝানো হয়েছে: তাঁর পরবর্তী প্রতিটি পর্যায় আগেরটির চেয়ে উত্তম হয়েছে — মক্কার কষ্টের পরে মদীনার বিজয়, তারপর আখিরাতের মর্যাদা।`]}]},{number:5,theme:`দেবেন, আপনি সন্তুষ্ট হবেন`,spans:[{t:`وَلَسَوْفَ يُعْطِ`},{t:`ي`,r:`madd`},{t:`كَ رَبُّكَ فَتَرْضَ`},{t:`ى`,r:`madd`}],uccharon:`ওয়ালাসাওফা ইউ‘তীকা রব্বুকা ফাতারদ্বা-`,translit:`Wa la-sawfa yuʿṭīka rabbuka fa-tarḍā`,bn:`আপনার পালনকর্তা সত্বরই আপনাকে দান করবেন, অতঃপর আপনি সন্তুষ্ট হবেন।`,en:`And your Lord is going to give you, and you will be satisfied.`,audio:{start:11.55,end:15.57},words:[{id:`93:5:1`,arabic:`وَلَسَوْفَ`,translit:`wa la-sawfa`,uccharon:`ওয়ালাসাওফা`,bn:`আর অবশ্যই অচিরেই`,en:`And surely soon`,grammar:`সংযোজক و + জোরসূচক লাম + سَوْفَ (ভবিষ্যৎসূচক)। লাম ও সাওফা একসাথে আসায় প্রতিশ্রুতিটি অত্যন্ত জোরালো হয়েছে।`},{id:`93:5:2`,arabic:`يُعْطِيكَ`,translit:`yuʿṭīka`,uccharon:`ইউ‘তীকা`,bn:`তিনি আপনাকে দান করবেন`,en:`He will tes:[{rule:`ghunnah`,text:`وَأَمَّا-তে م শাদ্দাযুক্ত — ২ হরকত গুন্নাহ।`},{rule:`qalqalah`,text:`فَحَدِّثْ শেষ হয়েছে ث দিয়ে — এটি কলকলার হরফ নয়, তাই ঝাঁকুনি ছাড়াই সাকিন করে থামতে হবে।`}],memoryHook:`শেষ আয়াতটি বাকি দুটি নির্দেশের ছাঁচ ভাঙে: আগের দুটি ছিল “করবেন না”, এটি হলো “করুন”। দুই নিষেধের পর একটি আদেশ — এই মোড়টাই শেষ আয়াতের চাবি।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`তৃতীয় ও শেষ নির্দেশ, যা মিলে যায় তৃতীয় অনুগ্রহের সাথে। আপনি নিঃস্ব ছিলেন, আল্লাহ অভাবমুক্ত করেছেন (আয়াত ৮) — সুতরাং সেই অনুগ্রহের কথা বলুন, গোপন করবেন না (আয়াত ১১)।`,`“হাদ্দিছ” শব্দটি তাফঈল রূপে এসেছে, যা বারবার ও বিস্তারিত বলার অর্থ দেয়। অর্থাৎ একবার নয় — আল্লাহর দানের কথা বারবার স্মরণ ও প্রকাশ করতে হবে।`,`রাসূলুল্লাহ ﷺ বলেছেন: “যে মানুষের কৃতজ্ঞতা আদায় করে না, সে আল্লাহরও কৃতজ্ঞতা আদায় করে না।” (আবু দাউদ, তিরমিযী) নিয়ামত প্রকাশ করাও কৃতজ্ঞতার একটি রূপ।`]},{title:`প্রকাশ, না অহংকার?`,body:[`আলিমগণ সীমারেখাটি স্পষ্ট করেছেন। নিয়ামতের কথা বলা যদি হয় আল্লাহর প্রশংসা ও কৃতজ্ঞতার উদ্দেশ্যে, তবে তা ইবাদত। আর যদি হয় নিজের বড়ত্ব দেখানো বা অন্যকে ছোট করার উদ্দেশ্যে, তবে তা অহংকার — যা নিষিদ্ধ।`,`পার্থক্যটি নিয়তের: “আল্লাহ আমাকে দিয়েছেন” বলা কৃতজ্ঞতা; “আমি অর্জন করেছি” বলা আত্মম্ভরিতা।`,`সবচেয়ে বড় নিয়ামত ছিল ওহী নিজেই — যা কিছুদিন বন্ধ ছিল। তাই সূরাটি যেখান থেকে শুরু হয়েছিল, সেখানেই ফিরে আসছে: সেই ওহীর কথা মানুষের কাছে পৌঁছে দিন।`]}]}],mindMap:{intro:`সূরাটি একটি আয়নার মতো: মাঝখানে সান্ত্বনার কেন্দ্রীয় বার্তা, আর তার দুই পাশে তিনটি অনুগ্রহ (আয়াত ৬–৮) ও ঠিক সেই ক্রমে তিনটি করণীয় (আয়াত ৯–১১)। এক পাশ মনে থাকলে অন্য পাশ আপনাআপনি চলে আসে।`,rootAyah:3,rootArabic:`مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى`,rootUccharon:`মা- ওয়াদ্দা‘আকা রব্বুকা ওয়ামা- ক্বলা-`,rootBn:`আপনার প্রতিপালক আপনাকে ত্যাগ করেননি, বিরূপও হননি — এটিই সূরার কেন্দ্রীয় বার্তা`,branches:[{ayah:6,stem:`أَلَمْ يَجِدْكَ`,stemUccharon:`আলাম ইয়াজিদকা`,payload:`يَتِيمًا فَآوَى`,payloadUccharon:`ইয়াতীমাং ফাআ-ওয়া-`,payloadBn:`এতীম ছিলেন → আশ্রয় দিলেন`,icon:`🏠`,gist:`এর জোড়া আয়াত ৯: “এতীমের প্রতি কঠোর হবেন না।” যে অভাব নিজে পেয়েছেন, তা আর কাউকে দেবেন না।`},{ayah:7,stem:`وَوَجَدَكَ`,stemUccharon:`ওয়া ওয়াজাদাকা`,payload:`ضَالًّا فَهَدَى`,payloadUccharon:`দ্বোয়া--ল্লাং ফাহাদা-`,payloadBn:`পথ জানতেন না → পথ দেখালেন`,icon:`🧭`,gist:`এর জোড়া আয়াত ১০: “প্রার্থীকে ধমক দেবেন না।” যে জানতে বা চাইতে আসে, তাকে ফেরাবেন না।`},{ayah:8,stem:`وَوَجَدَكَ`,stemUccharon:`ওয়া ওয়াজাদাকা`,payload:`عَائِلًا فَأَغْنَى`,payloadUccharon:`‘আ-য়িলাং ফাআগনা-`,payloadBn:`নিঃস্ব ছিলেন → সচ্ছল করলেন`,icon:`🌾`,gist:`এর জোড়া আয়াত ১১: “নিয়ামতের কথা প্রকাশ করুন।” যা পেয়েছেন, তা গোপন না করে কৃতজ্ঞতায় বলুন।`}],patterns:[{title:`তিন দান, তিন দায়িত্ব — নিখুঁত আয়না`,text:`আয়াত ৬–৮ তিনটি অনুগ্রহ, আর আয়াত ৯–১১ ঠিক সেই ক্রমেই তিনটি করণীয়। এতীম→এতীম, পথ→প্রার্থী, সম্পদ→নিয়ামত প্রকাশ। একদিক মনে থাকলে অন্যদিক আপনাআপনি আসে — এটিই এই সূরা মুখস্থের সবচেয়ে বড় চাবি।`},{title:`ছন্দ বদলায় ঠিক যেখানে বিষয় বদলায়`,text:`আয়াত ১–৮ প্রতিটি শেষ হয়েছে “-আ” ধ্বনিতে (দুহা, সাজা, ক্বলা, ঊলা, তারদ্বা, আ-ওয়া, হাদা, আগনা)। আয়াত ৯–১০ শেষ হয় “-হার” দিয়ে, আর ১১ “-দ্দিছ” দিয়ে। কান দিয়েই বোঝা যায় কখন সান্ত্বনার অংশ শেষ হয়ে নির্দেশের অংশ শুরু হলো।`},{title:`শপথ → সান্ত্বনা → প্রমাণ → করণীয়`,text:`সূরার চারটি ধাপ: দুটি শপথ (১–২), তিনটি সান্ত্বনা (৩–৫), তিনটি অতীত প্রমাণ (৬–৮), তিনটি করণীয় (৯–১১)। ২-৩-৩-৩ — এই সংখ্যার ছকটি মাথায় রাখলে কোনো আয়াত বাদ পড়বে না।`},{title:`“আম্মা”-র তিন সিঁড়ি`,text:`শেষ তিন আয়াত শুরু হয় একই শব্দে: ফাআম্মা, ওয়া আম্মা, ওয়া আম্মা। প্রথম দুটি নিষেধ (“করবেন না”), শেষটি আদেশ (“করুন”) — এই মোড়টাই শেষ আয়াতকে আলাদা করে চিনিয়ে দেয়।`},{title:`অতীত, ভবিষ্যৎ, বর্তমান`,text:`আয়াত ৬–৮ অতীতের কথা বলে, আয়াত ৪–৫ ভবিষ্যতের প্রতিশ্রুতি দেয়, আর ৯–১১ বলে বর্তমানে কী করতে হবে। তিন কালকে একসাথে গেঁথে সূরাটি সান্ত্বনাকে কর্মে রূপ দেয়।`}]}},{number:107,nameArabic:`سُورَةُ الْمَاعُون`,bnName:`সূরা আল-মা‘উন`,enName:`Al-Ma'un`,bnMeaning:`সামান্য সাহায্য / দৈনন্দিন প্রয়োজনীয় জিনিস`,revelation:`মাক্কী`,ayahCount:7,reciter:{name:`Yasser Al-Dosari`,bnName:`শাইখ ইয়াসির আদ-দোসারী`},audioUrl:`audio/107-al-maun-yasser-al-dosari.mp3`,intro:[`সূরা আল-মা‘উন কুরআনের ১০৭তম সূরা, আয়াত সংখ্যা ৭। সূরাটি খুব ছোট, অথচ দুই ধরনের মানুষের ছবি একসাথে এঁকে দেয় — যারা দীনকে মিথ্যা বলে (আয়াত ১–৩) আর যারা সালাত আদায় করে অথচ তাতে গাফিল (আয়াত ৪–৭)।`,`সূরার নাম “আল-মা‘উন” — যার অর্থ সামান্য সাহায্য, দৈনন্দিন প্রয়োজনীয় জিনিস। শেষ আয়াতে বলা হচ্ছে, এমন মানুষও আছে যারা লবণ-পানি-চামচের মতো সামান্য সাহায্যও প্রতিবেশীকে দিতে অস্বীকার করে।`,`সূরাটি মুখস্থ করাও সহজ: শুরু হয় একটি প্রশ্ন দিয়ে, তারপর সেই ব্যক্তির তিনটি বৈশিষ্ট্য, তারপর পাল্টে যায় বক্তব্য — সালাত আদায়কারী অথচ গাফিল লোকদের ওপর ধ্বংসের ওয়াইল।`],shanENuzul:{title:`শানে নুযূল ও প্রেক্ষাপট`,body:[`একটি বিখ্যাত বর্ণনায় এসেছে — ইবনে আব্বাস রাদিয়াল্লাহু আনহুসহ অনেক মুফাসসির বলেন, সূরাটি নাযিল হয়েছিল আবু সুফইয়ান বা ওয়ালিদ ইবনে মুগীরার ব্যাপারে। মক্কার কাফির নেতাদের মধ্যে কেউ কেউ প্রতি সপ্তাহে এতিম ও মিসকিনদের সামান্য খাবার দিতেন — লোক দেখানোর জন্য; আবার অনেকেই এতিমকে ঠেলে দিতেন এবং মিসকিনকে খাওয়াতেও উৎসাহিত করতেন না।`,`আরেকটি দৃষ্টিভঙ্গি অনুযায়ী সূরার দ্বিতীয়াংশ (আয়াত ৪–৭) মুনাফিকদের সম্পর্কে। ইবনে আব্বাস ও ইবনে মাসউদ রাদিয়াল্লাহু আনহুমা বলেন, মুনাফিকরা সালাত তো আদায় করত, কিন্তু তা লোক-দেখানো হতো এবং তারা সালাতে গাফিল ছিল।`,`উভয় ব্যাখ্যাই সূরার দুই ভাগকে বোঝায়: প্রথমাংশে “দীনকে মিথ্যা বলা” ব্যক্তির পরিচয়, আর দ্বিতীয়াংশে সেই সালাত-আদায়কারীদের সমালোচনা যাদের সালাত অন্তরের সজীবতা থেকে শূন্য।`]},virtues:{title:`ফযীলত ও শিক্ষা`,body:[`সূরাটি কুরআনের একটি পূর্ণাঙ্গ “সামাজিক আচরণ-সংহিতা” — ঈমানের দাবি শুধু কথায় নয়, এতিম-মিসকিনের প্রতি ব্যবহারেও প্রকাশ পায়। হাদীসে এসেছে, রাসূলুল্লাহ ﷺ বলেছেন: “যে ব্যক্তি এতিমকে (তার খরচ) বহন করে, আমি ও সে জান্নাতে এভাবে পাশাপাশি থাকব” — এবং তিনি তর্জনী ও মধ্যমা দুই আঙুল একসাথে দেখালেন। (সহীহ বুখারী)`,`সালাতের গাফিলি সম্পর্কে একটি মর্মস্পর্শী বর্ণনা: রাসূলুল্লাহ ﷺ বলেছেন — “সেই ব্যক্তির সালাত (আদায়ের অর্থ) তার সামনে উত্থাপিত হয় না, যে ব্যক্তি সালাতে গাফিল থাকে।” (বুখারী, “সালাতে গাফিলি” অধ্যায়ে বর্ণিত মর্ম) অর্থাৎ সালাত কবুল হওয়া নির্ভর করে খুশু‘র উপর।`,`লোক-দেখানো আমল (রিয়া) সম্পর্কে হাদীসে কঠিন সতর্কবাণী এসেছে — ছোট শিরক বলা হয়েছে। এই সূরায় সালাত আদায়কারী অথচ রিয়াকারদের ধ্বংসের ঘোষণা সেই হাদীসেরই কুরআনি রূপ।`]},ayahs:[{number:1,theme:`দীনকে মিথ্যা বলা`,spans:[{t:`أَرَأَيْ`},{t:`تَ `},{t:`ال`,r:`lam-shamsi`},{t:`َّذِ`},{t:`ي`,r:`madd`},{t:` `},{t:`يُكَذِّ`},{t:`بُ `},{t:`بِال`,r:`lam-shamsi`},{t:`دِّ`},{t:`ي`,r:`madd`},{t:`نِ`}],uccharon:`আরা’আইতাল্লাযী ইউকাযযিবু বিদ্দীন`,translit:`Ara'aytal-ladhī yukadhdhibu bid-dīn`,bn:`তুমি কি দেখেছ তাকে, যে দীনকে (প্রতিদানকে) মিথ্যা বলে?`,en:`Have you seen the one who denies the Recompense?`,audio:{start:0,end:3.55},words:[{id:`107:1:1`,arabic:`أَرَأَيْتَ`,translit:`ara'ayta`,uccharon:`আরা’আইতা`,bn:`তুমি কি দেখেছ?`,en:`Have you seen?`,root:`ر أ ي`,rootNote:`র-আ-ই মূলের অর্থ দেখা। “আরাআইতা” — প্রশ্নসূচক হামযা দিয়ে জিজ্ঞেস করা হচ্ছে: তুমি কি লক্ষ্য করেছ?`,grammar:`প্রশ্নসূচক হামযা + ফি‘ল মাদী, দ্বিতীয় পুরুষ একবচন, কর্তা তুমি।`},{id:`107:1:2`,arabic:`الَّذِي`,translit:`alladhī`,uccharon:`ল্লাযী`,bn:`যে`,en:`the one who`,grammar:`ইসমে মাওসূল (আপেক্ষিক সর্বনাম), পুরুষবাচক একবচন।`},{id:`107:1:3`,arabic:`يُكَذِّبُ`,translit:`yukadhdhibu`,uccharon:`ইউকাযযিবু`,bn:`মিথ্যা বলে, অস্বীকার করে`,en:`denies`,root:`ك ذ ب`,rootNote:`ক-য-ব মানে মিথ্যা। তাকযীব মানে কাউকে মিথ্যা প্রতিপন্ন করা — এখানে বিচার-প্রতিদানকে অস্বীকার করা।`,grammar:`ফি‘ল মুদারি, বাব তাফ‘ঈল (تثقيل সহ) — কর্তা সে, কর্ম দীন।`},{id:`107:1:4`,arabic:`بِالدِّينِ`,translit:`bid-dīn`,uccharon:`বিদ্দীন`,bn:`দীনকে, প্রতিদানকে`,en:`the Recompense`,root:`د ي ن`,rootNote:`দ-ই-ন মূল থেকে বহু অর্থ: প্রতিদান, হিসাব, আনুগত্য, ধর্ম। জমহুর মুফাসসির এখানে “হিসাব ও প্রতিদান” অর্থ নিয়েছেন।`,grammar:`হরফে জার بِ + মাজরূর ইসম; আলিফ-লাম যুক্ত বলে নির্দিষ্ট।`}],tajweedNotes:[{rule:`lam-shamsi`,text:`الَّذِي — ذ শামসী হরফ, তাই লাম পড়া হয় না: “আল-লাযী” নয়, “ল্লাযী”।`},{rule:`madd`,text:`الَّذِي ও بِالدِّينِ — দুই জায়গায় ইয়া মাদ্দ: “লাযী” ও “দীন” — ২ হরকত করে টান।`}],memoryHook:`সূরাটি একটি প্রশ্ন দিয়ে শুরু: “তুমি কি দেখেছ?” প্রশ্নের উত্তরটা নিজেই নিজের মনে দাও: দীনকে মিথ্যা বলে যে — তার পরিচয় পরের দুই আয়াতে। প্রশ্নটি মনে থাকলেই গোটা সূরাটি গেঁথে যায়।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“দীন” শব্দের এখানে সবচেয়ে গ্রহণযোগ্য অর্থ — প্রতিদান, হিসাব। অর্থাৎ ঐ ব্যক্তির কথা বলা হচ্ছে, যে বিশ্বাস করে না যে ভালো-মন্দের হিসাব হবে, কাজের প্রতিদান দিবস আসবে। এই অস্বীকার থেকেই তার নৈতিক অবনতির সূচনা।`,`বিস্ময়ব্যঞ্জক বিষয় — প্রশ্নটি শুরু হয়েছে “আরাআইতা” (তুমি কি দেখেছ?) দিয়ে। অর্থাৎ এটা এমন এক সত্য যাকে চোখ খুলে দেখলেই বোঝা যায়। দীনকে মিথ্যা বলা কোনো দার্শনিক প্রশ্ন নয়, তার প্রমাণ নেককার-বদকারের আচরণেই।`]},{title:`কেন প্রথমে অস্বীকারের কথা`,body:[`আমলের ভিত্তি হচ্ছে বিশ্বাস। যে প্রতিদানের দিনে বিশ্বাস করে না, তার নিকট এতিম-মিসকিনের অধিকার প্রায় অর্থহীন — কারণ তার কাছে তো কোনো হিসাবই নেই। তাই সূরার প্রথমে আনা হয়েছে বিশ্বাসের রোগ, পরে তার সামাজিক লক্ষণগুলো।`,`পরবর্তী আয়াতগুলো সেই অস্বীকারকারীর আচরণের তিনটি নমুনা দেখাবে — সেগুলো আসলে এই আয়াতেরই বাস্তব রূপ।`]}]},{number:2,theme:`এতিমকে ঠেলে দেওয়া`,spans:[{t:`فَذَ`},{t:`ٰ`,r:`madd`},{t:`لِكَ `},{t:`ال`,r:`lam-shamsi`},{t:`َّذِ`},{t:`ي`,r:`madd`},{t:` `},{t:`يَدُعُّ `},{t:`الْ`,r:`lam-qamari`},{t:`يَتِ`},{t:`ي`,r:`madd`},{t:`مَ`}],uccharon:`ফাযা-লিকাল্লাযী ইয়াদু‘উল-ইয়াতীম`,translit:`Fadhālikal-ladhī yaduʿʿul-yatīm`,bn:`সে-ই তো, যে এতিমকে কঠোরভাবে ঠেলে দেয়,`,en:`That is the one who drives away the orphan,`,audio:{start:3.55,end:7.15},words:[{id:`107:2:1`,arabic:`فَذَٰلِكَ`,translit:`fadhālika`,uccharon:`ফাযা-লিকা`,bn:`সুতরাং সে-ই তো / সেই তো`,en:`So that is`,grammar:`ফা (শব্দসূচনা) + ذَلِكَ (দূরের ইশারা) — সূরার আগের প্রশ্নের উত্তরে নির্দেশ।`},{id:`107:2:2`,arabic:`الَّذِي`,translit:`alladhī`,uccharon:`ল্লাযী`,bn:`যে`,en:`the one who`,grammar:`ইসমে মাওসূল, পুরুষবাচক একবচন।`},{id:`107:2:3`,arabic:`يَدُعُّ`,translit:`yaduʿʿu`,uccharon:`ইয়াদু‘উ`,bn:`ঠেলে দেয়, তাড়িয়ে দেয়`,en:`drives away`,root:`د ع ع`,rootNote:`দ-আ-আ মূলের অর্থ ধাক্কা দিয়ে সরানো, কঠোরভাবে বিতাড়িত করা। এতিমকে রূঢ়ভাবে দূরে সরিয়ে দেওয়ার চিত্র।`,grammar:`ফি‘ল মুদারি, দ্বিগুণ দাল (শাদ্দা সহ) — কর্তা সে, কর্ম এতি ভিত্তি।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“ওয়াইল” — ধ্বংস অথবা জাহান্নামের একটি উপত্যকা। মোটকথা, কঠিন শাস্তির ঘোষণা। এই ঘোষণা আসছে “সালাত আদায়কারীদের” জন্য — যারা নামায পড়ে অথচ তা তাদের জীবনকে সংশোধন করছে না।`,`মুফাসসিরগণ বলেন, এখানে মুনাফিকদের কথা। তারা লোক দেখানোর জন্য সালাত আদায় করত, অন্তরে খুশু ছিল না। ইবনে মাসউদ রাদিয়াল্লাহু আনহু বলেন, রাসূলুল্লাহ ﷺ-এর যুগে আমরা জানতাম — মুনাফিক ঐ ব্যক্তি, যে সালাতকে হালকা ভাবে এবং ফরয সালাত ছেড়ে দেয়।`,`বিষয়টি ভাববার মতো: কুরআন সালাত পড়াকে প্রশ্ন করছে না, বরং সেই সালাতকে প্রশ্ন করছে যা মানুষকে গাফিলি ও রিয়া থেকে বাঁচায় না।`]},{title:`কী শিখি`,body:[`আমলের মূল্য তার হাল ও পরিণামে। সালাত পড়া ঈমানের পরিচয় — কিন্তু যে সালাত অন্তরকে বদলায় না, যে সালাতে গাফিলি আর লোক-দেখানো মিশে থাকে, তার ব্যাপারে সতর্কবাণী এসেছে এই আয়াতে।`]}]},{number:5,theme:`সালাতে উদাসীনতা`,spans:[{t:`ال`,r:`lam-shamsi`},{t:`َّذِي`},{t:`نَ `},{t:`هُمْ `},{t:`عَ`},{t:`ن`,r:`ikhfa`},{t:` صَلَ`},{t:`ا`,r:`madd`},{t:`تِهِمْ `},{t:`سَ`},{t:`ا`,r:`madd`},{t:`هُ`},{t:`و`,r:`madd`},{t:`نَ`}],uccharon:`আল্লাযীনা হুম ‘আন সলাতিহিম সা-হূন`,translit:`Alladhīna hum ʿan ṣalātihim sāhūn`,bn:`যারা তাদের সালাতের ব্যাপারে উদাসীন,`,en:`Those who are heedless of their prayer,`,audio:{start:13.95,end:18.33},words:[{id:`107:5:1`,arabic:`الَّذِينَ`,translit:`alladhīna`,uccharon:`ল্লাযীনা`,bn:`যারা`,en:`those who`,grammar:`ইসমে মাওসূল, পুরুষবাচক বহুবচন।`},{id:`107:5:2`,arabic:`هُمْ`,translit:`hum`,uccharon:`হুম`,bn:`তারা`,en:`they`,grammar:`আলাদা সর্বনাম (দামির মুনফাসিল), পুরুষবাচক বহুবচন — জোর দেওয়ার জন্য।`},{id:`107:5:3`,arabic:`عَن`,translit:`ʿan`,uccharon:`‘আন`,bn:`থেকে, ব্যাপারে`,en:`about / of`,grammar:`হরফে জার।`},{id:`107:5:4`,arabic:`صَلَاتِهِمْ`,translit:`ṣalātihim`,uccharon:`সলাতিহিম`,bn:`তাদের সালাতের`,en:`their prayer`,root:`ص ل و`,grammar:`মুদাফ + সর্বনাম প্রত্যয় (তাদের) — মাজরূর।`},{id:`107:5:5`,arabic:`سَاهُونَ`,translit:`sāhūn`,uccharon:`সা-হূন`,bn:`উদাসীন, গাফিল`,en:`heedless`,root:`س ه و`,rootNote:`স-হা-ওয়াও মূল — ভুলে যাওয়া, উদাসীন হওয়া। সা র করে।`,en:`And withhold [simple] assistance.`,audio:{start:20.7,end:25.9},words:[{id:`107:7:1`,arabic:`وَيَمْنَعُونَ`,translit:`wa yamnaʿūn`,uccharon:`ওয়া ইয়ামনা‘উন`,bn:`আর তারা বাধা দেয়, অস্বীকার করে`,en:`and they withhold`,root:`م ن ع`,rootNote:`মীম-নূন-আইন মূল — আটকানো, বাধা দেওয়া। প্রাপ্য থেকে ফিরিয়ে রাখা।`,grammar:`সংযোজক و + ফি‘ল মুদারি, জাম‘ মুযাক্কার — কর্তা তারা, কর্ম মা‘উন।`},{id:`107:7:2`,arabic:`الْمَاعُونَ`,translit:`al-māʿūn`,uccharon:`মা-‘উন`,bn:`সামান্য সাহায্য, দৈনন্দিন প্রয়োজনীয় জিনিস`,en:`the small kindnesses`,root:`م ع ن`,rootNote:`মীম-আইন-নূন মূল — মা‘উন অর্থ প্রতিবেশীকে ধার দেওয়া বালতি, কুড়াল, পানি, লবণের মতো ছোট জিনিস।`,grammar:`মাফ‘উল বিহি — আলিফ-লাম যুক্ত, অর্থাৎ এমন জিনিস যা সামান্য হলেও লোকেরা জানতে পারে।`}],tajweedNotes:[{rule:`madd`,text:`يَمْنَعُونَ — ওয়াও মাদ্দ: “ইয়ামনা‘ঊন” — ২ হরকত টান।`},{rule:`lam-qamari`,text:`الْمَاعُونَ — মীম কমরী হরফ, তাই লাম স্পষ্ট: “আল-মা-‘উন”।`},{rule:`madd`,text:`الْمَاعُونَ — আলিফ ও ওয়াও মাদ্দ: “মাা-‘ঊন” — দুটি টান।`}],memoryHook:`সূরার নামই শেষ শব্দ — “আল-মা‘উন”। মনে রাখুন: লবণ-পানি-চামচের মতো সামান্য জিনিস ধার না দেওয়া, প্রতিবেশীকে না সাহায্য করা — এই তো শেষ আয়াতের কথা। নামটা মনে থাকলে শেষ আয়াতটাও মনে থাকবে।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“মা‘উন” — এমন ছোট-খাটো জিনিস যা প্রতিবেশী ও অভাবীর প্রায়ই প্রয়োজন হয় এবং তা ধার দেওয়া বা দেওয়া হয়: বালতি, কুড়াল, চুলা, লবণ, পানি। এই আয়াত বলছে — রিয়াকার ও গাফিল লোকেরা এমন সামান্য সাহায্যও করতে চায় না; মানুষ যেন তাদের “কৃপণ” জানে, এমন ভাবও তারা চায় না।`,`কিছু মুফাসসির বলেছেন, মা‘উন অর্থ যাকাত; অর্থাৎ তারা যাকাত দেয় না। আবার কেউ বলেছেন — সামান্য সাহায্য। উভয় অর্থই সামঞ্জস্যপূর্ণ: আয়াতটি কৃপণতা ও লোকদের প্রতি উদাসীনতার নিন্দা করছে।`,`আকর্ষণীয় বিষয়: সূরাটি যেভাবে শেষ হলো — “সামান্য সাহায্য অস্বীকার” — প্রথম আয়াতের সাথে মিলে যায়। প্রথমে বলেছিল, দীনকে মিথ্যা বলে যে; শেষে দেখা যাচ্ছে, তার স্বভাবই হলো সাহায্য অস্বীকার করা।`]},{title:`শেষ শিক্ষা`,body:[`সূরার বার্তা সুস্পষ্ট: ঈমান কেবল বিশ্বাসের কথা নয় — তার প্রমাণ আচরণে। এতিমকে ঠেলে ব্যক্তির, শেষ চার আয়াত “সালাত আদায়কারী অথচ গাফিল” লোকদের। দুটি দলই অন্তরের আল্লাহ-সম্পর্ক থেকে দূরে — তাই আচরণেও তাদের ত্রুটি।`},{title:`“আল্লাযীনা হুম” — দ্বিগুণ`,text:`আয়াত ৫ ও ৬ একইভাবে শুরু হয়: “الَّذِينَ هُمْ”। অর্থাৎ গাফিলদের দুই চেহারা — উদাসীনতা ও রিয়া — একই ছাঁচে আনা হয়েছে, যা মুখস্থে সাহায্য করে।`},{title:`তিনটি “-উন”`,text:`সূরার শেষ তিনটি শব্দ — سَاهُونَ، يُرَاءُونَ، الْمَاعُونَ — সবগুলো “-উন” (নূন, ওয়াও, নূন) দিয়ে শেষ হয়। এই ধ্বনিগত প্রতিধ্বনি আয়াত ৫–৭-কে এক ছন্দে বেঁধে দেয়।`},{title:`প্রশ্ন থেকে উত্তর`,text:`সূরার প্রথম শব্দ প্রশ্ন: “তুমি কি দেখেছ?” তারপর পুরো সূরাটাই সেই প্রশ্নের বিস্তারিত উত্তর — কার কথা বলা হচ্ছে, তার বৈশিষ্ট্যগুলো কী। প্রশ্নটি মনে রাখলে সূরার ধারা মনে রাখা সহজ।`},{title:`শুরু-শেষের মিল`,text:`সূরাটি শেষ হয় “সামান্য সাহায্য অস্বীকার” দিয়ে — যা প্রথম আয়াতের “দীনকে মিথ্যা বলা”-এরই সামাজিক রূপ। অর্থাৎ শুরু আর শেষ একই সত্যের দুই পাশ।`}]}},{number:113,nameArabic:`سُورَةُ الْفَلَق`,bnName:`সূরা আল-ফালাক`,enName:`Al-Falaq`,bnMeaning:`প্রভাত / নিশিভোর`,revelation:`মাক্কী`,ayahCount:5,reciter:{name:`Yasser Al-Dosari`,bnName:`শাইখ ইয়াসির আদ-দোসারী`},audioUrl:`audio/113-al-falaq-yasser-al-dosari.mp3`,intro:[`সূরা আল-ফালাক কুরআনের ১১৩তম সূরা, আয়াত সংখ্যা ৫। সূরা আন-নাস-এর সাথে মিলে একে বলা হয় “মুআওবিযাতাইন” — আশ্রয় প্রার্থনার দুই সূরা।`,`পুরো সূরাটি একটিমাত্র বাক্যের কাঠামোয় দাঁড়িয়ে আছে: “আমি আশ্রয় চাই ... এর অনিষ্ট থেকে”। প্রথমে ব্যাপক অর্থে সব সৃষ্টির অনিষ্ট, তারপর তিনটি নির্দিষ্ট বিপদ — রাতের অন্ধকার, যাদু, এবং হিংসা।`,`এই কাঠামোই সূরাটিকে মুখস্থ করা সহজ করে দেয়: একই স্তম্ভ “মিং শাররি” চারবার ফিরে আসে, শুধু তার পরের অংশ বদলায়।`],shanENuzul:{title:`শানে নুযূল ও প্রেক্ষাপট`,body:[`সহীহ বুখারী ও সহীহ মুসলিমে আয়িশা রাদিয়াল্লাহু আনহা থেকে বর্ণিত, ইহুদী লাবীদ ইবনুল আ‘সাম রাসূলুল্লাহ ﷺ-এর উপর যাদু করেছিল। সেই যাদুর প্রভাবে তিনি অসুস্থতা বোধ করেন, এবং আল্লাহ তাঁকে জানিয়ে দেন যাদুর উপকরণ কোথায় লুকানো আছে। মুফাসসিরগণের একটি বড় অংশ বলেন, এ প্রেক্ষাপটেই মুআওবিযাতাইন — সূরা ফালাক ও সূরা নাস — নাযিল হয়।`,`সূরাটি মাক্কী হিসেবেই বেশি পরিচিত, তবে কিছু বর্ণনায় একে মাদানী বলা হয়েছে। উভয় মতের ভিত্তি আছে; মূল শিক্ষায় এতে কোনো পার্থক্য হয় না।`,`গুরুত্বপূর্ণ বিষয় হলো — সূরাটি কেবল ইতিহাস নয়। এটি প্রত্যেক মুমিনের জন্য প্রতিদিনের নিরাপত্তা-দুআ, যেখানে অনিষ্টের চারটি উৎসকে একসাথে গুছিয়ে দেওয়া হয়েছে।`]},virtues:{title:`ফযীলত`,body:[`উকবা ইবনে আমির রাদিয়াল্লাহু আনহু বলেন, রাসূলুল্লাহ ﷺ আমাকে বললেন: “তুমি কি দেখোনি, আজ রাতে এমন কিছু আয়াত নাযিল হয়েছে যার তুলনা কখনও দেখা যায়নি? — সূরা ফালাক ও সূরা নাস।” (সহীহ মুসলিম)`,`আয়িশা রাদিয়াল্লাহু আনহা বর্ণনা করেন, রাসূলুল্লাহ ﷺ প্রতি রাতে ঘুমানোর আগে দুই হাত একত্র করে সূরা ইখলাস, ফালাক ও নাস পড়ে হাতে ফুঁ দিতেন, তারপর সাধ্যমতো সারা শরীরে হাত বুলিয়ে নিতেন — তিনবার। (সহীহ বুখারী)`,`উকবা ইবনে আমির রাদিয়াল্লাহু আনহু থেকে আরও বর্ণিত, প্রতি ফরয সালাতের পর মুআওবিযাত পড়ার নির্দেশ রাসূলুল্লাহ ﷺ দিয়েছেন। (আবু দাউদ, নাসাঈ)`]},ayahs:[{number:1,theme:`আশ্রয়ের ঘোষণা`,spans:[{t:`قُلْ `},{t:`أَ`},{t:`عُو`,r:`madd`},{t:`ذُ `},{t:`بِرَبِّ `},{t:`الْ`,r:`lam-qamari`},{t:`فَلَ`},{t:`قِ`,r:`qalqalah`}],uccharon:`কুল আউযু বিরব্বিল ফালাক্ব`,translit:`Qul aʿūdhu bi rabbil-falaq`,bn:`বলুন, আমি আশ্রয় নিচ্ছি প্রভাতের প্রতিপালকের কাছে,`,en:`Say: I seek refuge in the Lord of the daybreak,`,audio:{start:0,end:2.62},words:[{id:`113:1:1`,arabic:`قُلْ`,translit:`qul`,uccharon:`কুল`,bn:`বলুন / বলো`,en:`Say`,root:`ق و ل`,rootNote:`ق-و-ل মূল থেকে আসে “বলা, কথা” — কুরআনে সবচেয়ে বেশি ব্যবহৃত মূলগুলোর একটি।`,grammar:`ফি‘ল আমর (আদেশসূচক ক্রিয়া), দ্বিতীয় পুরুষ পুংলিঙ্গ একবচন।`},{id:`113:1:2`,arabic:`أَعُوذُ`,translit:`aʿūdhu`,uccharon:`আউযু`,bn:`আমি আশ্রয় নিচ্ছি`,en:`I seek refuge`,root:`ع و ذ`,rootNote:`ع-و-ذ মানে কোনো শক্তিশালী আশ্রয়ের দিকে ছুটে গিয়ে নিজেকে আড়াল করা — “আউযুবিল্লাহ”-ও একই মূল থেকে।`,grammar:`ফি‘ল মুদারি (বর্তমান/ভবিষ্যৎ ক্রিয়া), উত্তম পুরুষ একবচন।`},{id:`113:1:3`,arabic:`بِرَبِّ`,translit:`bi rabbi`,uccharon:`বিরব্বি`,bn:`প্রতিপালকের কাছে`,en:`in (the) Lord`,root:`ر ب ب`,rootNote:`ر-ب-ب মূলের অর্থ কেবল “প্রভু” নয় — যিনি মালিক, যিনি লালন-পালন করে ধাপে ধাপে পূর্ণতায় পৌঁছান।`,grammar:`হরফে জার بِ + মাজরূর ইসম; এটি আবার পরের শব্দের মুদাফ।`},{id:`113:1:4`,arabic:`الْفَلَقِ`,translit:`al-falaq`,uccharon:`ল ফালাক্ব`,bn:`প্রভাতের, নিশিভোরের`,en:`(of) the daybreak`,root:`ف ل ق`,rootNote:`ف-ل-ق মূলের অর্থ “ফাটিয়ে দেওয়া, বিদীর্ণ করা”। রাতের অন্ধকার ফেটে যে আলো বের হয় — তা-ই ফালাক।`,grammar:`মুদাফ ইলাইহি, মাজরূর; আলিফ-লাম যুক্ত হওয়ায় নির্দিষ্ট।`}],tajweedNotes:[{rule:`madd`,text:`أَعُوذُ — পেশের পরে সাকিন ওয়াও, তাই “আ-ঊ-যু”-তে ঠিক ২ হরকত টান।`},{rule:`lam-qamari`,text:`الْفَلَقِ — ف কমরী হরফ, তাই লাম স্পষ্ট: “আল-ফালাক্ব”।`},{rule:`qalqalah`,text:`الْفَلَقِ-এর শেষ ق-তে থামলে কলকলা কুবরা — “ফালাক্ব” উচ্চারণে হালকা ঝাঁকুনি।`}],memoryHook:`পুরো সূরার ভিত্তি এই আয়াত: “কে বলবে” (কুল) — “কী করবে” (আউযু) — “কার কাছে” (বিরব্বিল ফালাক্ব)। তিনটি প্রশ্নের উত্তর মনে রাখলে আয়াতটি আর ভোলার নয়।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“কুল” — বলুন। আল্লাহ তাআলা তাঁর রাসূল ﷺ-কে সরাসরি নির্দেশ দিচ্ছেন, এবং তাঁর মাধ্যমে প্রতিটি উম্মতকে। লক্ষণীয়, দুআটি এখানে শেখানো হচ্ছে হুবহু শব্দে — অর্থাৎ আশ্রয় চাওয়ার ভাষাটাও আল্লাহই দিয়ে দিচ্ছেন।`,`“আউযু” শব্দটি ع-و-ذ মূল থেকে, যার চিত্রকল্প হলো — দুর্বল কেউ বিপদ দেখে দৌড়ে গিয়ে একটি শক্ত আশ্রয়ের পেছনে লুকিয়ে পড়ছে। আশ্রয় প্রার্থনা তাই কেবল মুখের উচ্চারণ নয়, অন্তরের নির্ভরতা।`,`“ফালাক” শব্দের মূল অর্থ ফেটে যাওয়া। জমহুর মুফাসসির — ইবনে আব্বাস রাদিয়াল্লাহু আনহুসহ — বলেন এখানে ফালাক অর্থ ভোর/প্রভাত, কারণ রাতের অন্ধকার বিদীর্ণ করে সকাল বেরিয়ে আসে। কেউ কেউ ব্যাপক অর্থ নিয়েছেন: যা কিছুকে আল্লাহ ফাটিয়ে অস্তিত্ব দেন — বীজ থেকে অঙ্কুর, মেঘ থেকে বৃষ্টি, গর্ভ থেকে প্রাণ।`]},{title:`কেন “রব” নামটি বেছে নেওয়া হলো`,body:[`আল্লাহর বহু নামের মধ্য থেকে এখানে “রব” এসেছে — যিনি সৃষ্টি করেন, রিযিক দেন, পরিচালনা করেন। যিনি প্রতিদিন অন্ধকার চিরে আলো বের করে আনতে পারেন, তাঁর পক্ষে বান্দার বিপদের অন্ধকার চিরে মুক্তি বের করাও কঠিন নয়।`,`অর্থাৎ আয়াতটি কেবল ভয়ের কথা বলছে না — এটি একই সাথে আশার ঘোষণা। ভোরের মালিক যাঁর হাতে, রাত তাঁকে হারাতে পারে না।`]}]},{number:2,theme:`সমস্ত সৃষ্টির অনিষ্ট`,spans:[{t:`مِ`},{t:`نْ`,r:`ikhfa`},{t:` شَرِّ مَ`},{t:`ا`,r:`madd`},{t:` خَلَ`},{t:`قَ`,r:`qalqalah`}],uccharon:`মিং শাররি মা-খলাক্ব`,translit:`Min sharri mā khalaq`,bn:`তিনি যা সৃষ্টি করেছেন, তার অনিষ্ট থেকে,`,en:`From the evil of that which He created,`,audio:{start:2.62,end:5.4},words:[{id:`113:2:1`,arabic:`مِنْ`,translit:`min`,uccharon:`মিং`,bn:`(এর) থেকে`,en:`From`,grammar:`হরফে জার; পরের ش-এর কারণে ইখফা হয়ে উচ্চারণ “মিং”।`},{id:`113:2:2`,arabic:`شَرِّ`,translit:`sharri`,uccharon:`শাররি`,bn:`অনিষ্ট, ক্ষতি`,en:`(the) evil`,root:`ش ر ر`,rootNote:`ش-ر-ر মানে মন্দ, ক্ষতি, অকল্যাণ — “খাইর” (কল্যাণ)-এর বিপরীত শব্দ।`,grammar:`মাজরূর ইসম, এবং পরের অংশের মুদাফ।`},{id:`113:2:3`,arabic:`مَا`,translit:`mā`,uccharon:`মা`,bn:`যা কিছু`,en:`(of) what`,grammar:`ইসমে মাওসূল — “যা/যেসব”, ব্যাপক অর্থ বোঝায়।`},{id:`113:2:4`,arabic:`خَلَقَ`,translit:`khalaqa`,uccharon:`খলাক্ব`,bn:`তিনি সৃষ্টি করেছেন`,en:`He created`,root:`خ ل ق`,rootNote:`خ-ل-ق মানে পরিমাপ অনুযায়ী নতুন করে অস্তিত্ব দান — “খালিক”, “মাখলুক”, “খলক” সবই এই মূল থেকে।`,grammar:`ফি‘ল মাদী (অতীত ক্রিয়া), কর্তা আল্লাহ।`}],tajweedNotes:[{rule:`ikhfa`,text:`مِنْ شَرِّ — নূন সাকিনের পরে ش, তাই ইখফা: “মিন” নয়, ২ হরকত গুন্নাহসহ “মিং”।`},{rule:`madd`,text:`مَا — যবরের পর আলিফ, ২ হরকত টান।`},{rule:`qalqalah`,text:`خَلَقَ-এর শেষ ق-তে থামলে কলকলা কুবরা — “খলাক্ব”।`}],memoryHook:`এই আয়াতটি সবচেয়ে ছোট এবং সবচেয়ে ব্যাপক — মাত্র চার শব্দে গোটা সৃষ্টিজগৎ ঢেকে যায়। মনে রাখুন: প্রথমে “সব”, তারপর তিনটি “বিশেষ”।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“মা খলাক” — “যা কিছু তিনি সৃষ্টি করেছেন”। এটি একটি ব্যাপক (আম) বাক্য: মানুষ, জিন, পশু, রোগ, দুর্ঘটনা, নিজের নফস — সৃষ্টিজগতের যেকোনো কিছু থেকে আসা অনিষ্ট এতে অন্তর্ভুক্ত।`,`তাফসীরের একটি সূক্ষ্ম বিষয় এখানে খেয়াল করার মতো: আয়াতে বলা হয়নি “তাঁর সৃষ্টির অনিষ্ট থেকে” এভাবে যে অনিষ্টকে আল্লাহর দিকে সম্পর্কিত করা হয়; বরং বলা হয়েছে “তিনি যা সৃষ্টি করেছেন তার অনিষ্ট”। আল্লাহর সৃষ্টিকর্ম হিকমতপূর্ণ ও কল্যাণময়; অনিষ্ট আসে সৃষ্টির কাজ ও আচরণ থেকে।`,`ইমাম ইবনুল কায়্যিম বলেন, ব্যাপক শব্দে আশ্রয় চাওয়ার ় ২ হরকতের স্বাভাবিক টান।`},{rule:`qalqalah`,text:`وَقَبَ-এর শেষ ب-তে থামলে কলকলা কুবরা — “ওয়াক্বব”।`}],memoryHook:`আয়াত ৩ ও আয়াত ৫ একই ছাঁচে গড়া: [বিপদের নাম] + إِذَا + [ক্রিয়া]। “গ-ছিক্বিন ইযা ওয়াক্বব” আর “হাছিদিন ইযা হাসাদ” — জোড়া বেঁধে মুখস্থ করলে দুটোই একসাথে বসে যায়।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“গাসিক” অর্থ রাত, বিশেষত যখন তার অন্ধকার ঘন হয়ে সবকিছু ঢেকে ফেলে। “ওয়াকাব” অর্থ প্রবেশ করা, ছড়িয়ে গিয়ে ভরে ফেলা। অর্থাৎ — সেই মুহূর্তের কথা বলা হচ্ছে যখন সন্ধ্যা রাতে রূপ নেয় এবং অন্ধকার চারদিক ঢেকে দেয়।`,`রাতের অন্ধকারে ক্ষতির উপকরণগুলো সক্রিয় হয় — হিংস্র প্রাণী বের হয়, অপরাধী সুযোগ পায়, মানুষ একা ও অরক্ষিত হয়ে পড়ে, আর অন্তরের কুমন্ত্রণাও রাতে বেশি শক্তিশালী হয়। এজন্যই রাতে ঘরে ফেরা, দরজা বন্ধ করা ও শিশুদের ঘরে রাখার নির্দেশ হাদীসে এসেছে (সহীহ বুখারী)।`,`তিরমিযীতে আয়িশা রাদিয়াল্লাহু আনহা থেকে বর্ণিত, রাসূলুল্লাহ ﷺ চাঁদের দিকে ইঙ্গিত করে বলেছিলেন: “হে আয়িশা, এর অনিষ্ট থেকে আল্লাহর আশ্রয় চাও; কেননা এটিই ‘আল-গাসিকু ইযা ওয়াকাব’।” এ থেকে বোঝা যায়, আয়াতের অর্থে রাতের সেই অবস্থাও অন্তর্ভুক্ত যখন আলো ঢাকা পড়ে যায়।`]},{title:`মূল শিক্ষা`,body:[`লক্ষ করুন, আয়াতে রাতের নিন্দা করা হয়নি — রাত আল্লাহর নিদর্শন ও বিশ্রামের নিআমত। আশ্রয় চাওয়া হয়েছে রাতে সংঘটিত “অনিষ্ট” থেকে, শর্তসাপেক্ষে: “যখন তা ছেয়ে যায়”।`,`বাস্তব প্রয়োগ: সন্ধ্যার যিকির-আযকার, ঘুমের আগে মুআওবিযাত পাঠ — এগুলোই এই আয়াতের বাস্তব বাস্তবায়ন।`]}]},{number:4,theme:`যাদু ও গিরায় ফুঁ`,spans:[{t:`وَمِ`},{t:`نْ`,r:`ikhfa`},{t:` شَرِّ `},{t:`ال`,r:`lam-shamsi`},{t:`نَّ`,r:`ghunnah`},{t:`فَّ`},{t:`ا`,r:`madd`},{t:`ثَ`},{t:`ا`,r:`madd`},{t:`تِ فِ`},{t:`ي`,r:`madd`},{t:` `},{t:`الْ`,r:`lam-qamari`},{t:`عُقَ`},{t:`دِ`,r:`qalqalah`}],uccharon:`ওয়া মিং শাররিন-নাফ্‌ফাছাতি ফিল্‌ উক্বাদ`,translit:`Wa min sharrin-naffāthāti fil-ʿuqad`,bn:`আর গিরায় ফুঁ-দানকারিণীদের অনিষ্ট থেকে,`,en:`And from the evil of those who blow on knots,`,audio:{start:9.58,end:14.36},words:[{id:`113:4:1`,arabic:`وَمِنْ`,translit:`wa min`,uccharon:`ওয়া মিং`,bn:`আর ... থেকে`,en:`And from`,grammar:`সংযোজক و + হরফে জার مِنْ।`},{id:`113:4:2`,arabic:`شَرِّ`,translit:`sharri`,uccharon:`শাররি`,bn:`অনিষ্ট`,en:`(the) evil`,root:`ش ر ر`,grammar:`মাজরূর ইসম, মুদাফ।`},{id:`113:4:3`,arabic:`النَّفَّاثَاتِ`,translit:`an-naffāthāti`,uccharon:`নাফ্‌ফাছাতি`,bn:`ফুঁ-দানকারিণীদের (যাদুকরিণীদের)`,en:`the (women) blowers`,root:`ن ف ث`,rootNote:`ن-ف-ث মানে থুতু প্রায় ছাড়াই হালকা ফুঁ দেওয়া — যাদুকর মন্ত্র পড়ে গিঁটে যেভাবে ফুঁ দেয়।`,grammar:`মুবালাগার রূপ (নাফ্‌ফাছ = অত্যধিক ফুঁদানকারী), স্ত্রীবাচক বহুবচন — অর্থাৎ বারবার এ কাজ করে এমন নারীরা।`},{id:`113:4:4`,arabic:`فِي`,translit:`fī`,uccharon:`ফিল্‌`,bn:`মধ্যে`,en:`in`,grammar:`হরফে জার।`},{id:`113:4:5`,arabic:`الْعُقَدِ`,translit:`al-ʿuqad`,uccharon:`উক্বাদ`,bn:`গিঁটগুলোতে`,en:`the knots`,root:`ع ق د`,rootNote:`ع-ق-د মানে বাঁধা, গিঁট দেওয়া — “আকদ” (বিবাহ-চুক্তি) শব্দটিও এই মূল থেকেই, কারণ তা এক বন্ধন।`,grammar:`عُقْدَة-এর বহুবচন, মাজরূর।`}],tajweedNotes:[{rule:`ikhfa`,text:`وَمِنْ شَرِّ — ইখফা, “ওয়া মিং শাররি”।`},{rule:`lam-shamsi`,text:`النَّفَّاثَاتِ — ن শামসী হরফ, তাই লাম পড়া হয় না: “আন-নাফ্‌ফাছাতি”।`},{rule:`ghunnah`,text:`نَّ-তে শাদ্দাহ, তাই ২ হরকত গুন্নাহ।`},{rule:`lam-qamari`,text:`الْعُقَدِ — ع কমরী হরফ, তাই লাম স্পষ্ট: “আল-উক্বাদ”।`},{rule:`qalqalah`,text:`الْعُقَدِ-এর শেষ د-তে থামলে কলকলা কুবরা — “উক্বাদ”।`}],memoryHook:`এটি সূরার সবচেয়ে লম্বা আয়াত। ভাঙুন তিন টুকরোয়: “ওয়া মিং শাররি” + “ন-নাফ্‌ফাছাতি” + “ফিল্‌ উক্বাদ”। প্রথম টুকরো তো আগে থেকেই জানা — বাকি দুটোই নতুন।`,tafsir:[{title:`আয়াতের ব্যাখ্যা`,body:[`“নাফ্‌ফাছাত” শব্দটি এসেছে ن-ف-ث মূল থেকে, যার অর্থ ফুঁ দেওয়া। যাদুকররা সুতা বা রশিতে গিঁট দিয়ে তাতে মন্ত্র পড়ে ফুঁ দিত — এটাই ছিল যাদুর প্রচলিত পদ্ধতি। আয়াতে তাই “গিঁটে ফুঁ-দানকারিণীদের” অনিষ্ট থেকে আশ্রয় চাওয়ার নির্দেশ।`,`শব্দটি স্ত্রীবাচক বহুবচনে এসেছে। মুফাসসিরগণ এর কয়েকটি ব্যাখ্যা দিয়েছেন: (১) ইতিহাসে যাদুচর্চায় নারীদের সম্পৃক্ততা বেশি ছিল, (২) “নুফূস” অর্থাৎ যাদুকরদের নফসসমূহ বোঝানো হয়েছে, (৩) স্ত্রীবাচক বহুবচন এখানে দলগত অর্থ বোঝাচ্ছে — নারী-পুরুষ নির্বিশেষে যারা এ কাজ করে।`,`আয়াতটি একটি আকীদাগত সত্য প্রতিষ্ঠা করে: যাদু বাস্তব, কল্পনা নয়। কিন্তু একই সাথে বলে — তা আল্লাহর অনুমতির বাইরে কারও ক্ষতি করতে পারে না, আর তার প্রতিকারও আল্লাহর আশ্রয়ের মধ্যেই।`]},{title:`সতর্কতা ও প্রতিকার`,body:[`যাদু-টোনা করা কবিরা গুনাহ, আর যাদুর প্রতিকারের জন্য আরেক যাদুকরের কাছে যাওয়াও নিষিদ্ধ। শরীয়তসম্মত প্রতিকার হলো রুকইয়াহ — কুরআনের আয়াত ও মাসনূন দুআ পড়া, বিশেষত আয়াতুল কুরসী ও মুআওবিযাতাইন।`,`নিয়মিত সকাল-সন্ধ্যার আযকার এবং ঘুমের আগে এই সূরা পাঠ যাদু ও বদনজর থেকে সুরক্ষার প্রতিষেধক হিসেবে হাদীসে বর্ণিত হয়েছে।`]}]},{number:5,theme:`হিংসা ও বদনজর`,spans:[{t:`وَمِ`},{t:`نْ`,r:`ikhfa`},{t:` شَرِّ حَ`},{t:`ا`,r:`madd`},{t:`سِ`},{t:`دٍ`,r:`izhar`},{t:` إِذَ`},{t:`ا`,r:`madd`},{t:` حَسَ`},{t:`دَ`,r:`qalqalah`}],uccharon:`ওয়া মিং শাররি হাছিদিন ইযা হাসাদ`,translit:`Wa min sharri ḥāsidin idhā ḥasad`,bn:`আর হিংসুকের অনিষ্ট থেকে, যখন সে হিংসা করে।`,en:`And from the evil of an envier when he envies.`,audio:{start:14.36,end:20.4},words:[{id:`113:5:1`,arabic:`وَمِنْ`,translit:`wa min`,uccharon:`ওয়া মিং`,bn:`আর ... থেকে`,en:`And from`,grammar:`সংযোজক و + হরফে জার مِنْ।`},{id:`113:5:2`,arabic:`شَرِّ`,translit:`sharri`,uccharon:`শাররি`,bn:`অনিষ্ট`,en:`(the) evil`,root:`ش ر ر`,grammar:`মাজরূর ইসম, মুদাফ।`},{id:`113:5:3`,arabic:`حَاسِدٍ`,translit:`ḥāsidin`,uccharon:`হাছিদিন`,bn:`হিংসুকের`,en:`(of) an envier`,root:`ح س د`,rootNote:`ح-س-د মানে অন্যের নিআমত দেখে তা ধ্বংস হোক — এই কামনা করা। এটি ইবলীসের প্রথম অপরাধের মূল।`,grammar:`ইসমে ফাইল, নাকিরা (তানভীনযুক্ত)।`},{id:`113:5:4`,arabic:`إِذَا`,translit:`idhā`,uccharon:`ইযা`,bn:`যখন`,en:`when`,grammar:`সময়সূচক শর্তবাচক শব্দ (যরফ)।`},{id:`113:5:5`,arabic:`حَسَدَ`,translit:`ḥasada`,uccharon:`হাসাদ`,bn:`সে হিংসা করে`,en:`he envies`,root:`ح س د`,grammar:`ফি‘ল মাদী (অতীত ক্রিয়া)।`}],tajweedNotes:[{rule:`ikhfa`,text:`وَمِنْ شَرِّ — চতুর্থবারের ইখফা: “ওয়া মিং শাররি”।`},{rule:`izhar`,text:`حَاسِدٍ إِذَا — তানভীনের পরে হামযা, তাই ইযহার: “হাছিদিন ইযা”।`},{rule:`madd`,text:`حَا এবং إِذَا — ২ হরকতের স্বাভাবিক টান।`},{rule:`qalqalah`,text:`حَسَدَ-এর শে
